[project]
name = "trevor-graphiti-sidecar"
version = "0.1.0"
description = "Private Graphiti sidecar for Trevor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "falkordblite==0.10.0",
    "graphiti-core[falkordb,google-genai]",
    "httpx>=0.28,<1",
    "pyobjc-framework-Security; platform_system == 'Darwin'",
    "redis<9",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
trevor-graphiti = "trevor_graphiti.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trevor_graphiti"]

[tool.uv.sources]
graphiti-core = { path = "../../vendor/graphiti" }

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
